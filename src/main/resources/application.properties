spring.application.name=auth0fgademo

# ==========================================
# Auth0 FGA / OpenFGA Configuration
# ==========================================
# Spring will look for the Environment Variable first.
# If not found, it falls back to the placeholder text.
fga.api-url=${FGA_API_URL:https://api.us1.fga.dev}
fga.store-id=${FGA_STORE_ID:INSERT_YOUR_STORE_ID_HERE}
fga.client-id=${FGA_CLIENT_ID:INSERT_YOUR_CLIENT_ID_HERE}
fga.client-secret=${FGA_CLIENT_SECRET:INSERT_YOUR_CLIENT_SECRET_HERE}

# Bypassing default Spring Security for local testing
spring.security.user.name=admin
spring.security.user.password=admin